<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WanderStyle - Travel & Wardrobe Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        canvas: '#F8F7F4',
                        stone: {
                            50: '#FBFBFA',
                            100: '#F2F0EC',
                            200: '#E4E0D5',
                            300: '#D0C9BB',
                            400: '#B8AFA0'
                        },
                        olive: {
                            500: '#7E8670',
                            600: '#646C57',
                            700: '#4D5442'
                        },
                        sand: {
                            500: '#D4B896',
                            600: '#BA9B74'
                        },
                        terracotta: {
                            500: '#B86F52',
                            600: '#9E5A3F'
                        },
                        charcoal: {
                            800: '#33302B',
                            900: '#1F1D1A'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8F7F4;
            color: #1F1D1A;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-full font-sans text-charcoal-900 flex flex-col antialiased selection:bg-charcoal-900 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-canvas/90 backdrop-blur-md border-b border-stone-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-charcoal-900 flex items-center justify-center text-canvas shadow-sm">
                        <i class="fa-solid fa-compass text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-black tracking-tight text-black">WanderStyle Studio</h1>
                        <p class="text-[10px] uppercase tracking-widest text-olive-700 font-extrabold hidden sm:block">Aesthetic Travel & Capsule Wardrobe</p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="switchTab('destination')" class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-stone-100 hover:bg-stone-200/80 transition text-xs font-extrabold text-black border border-stone-300">
                        <i class="fa-solid fa-location-dot text-terracotta-500"></i>
                        <span id="currentDestBadge">Manila, Philippines</span>
                    </button>
                    <!-- Account Profile / Sign In Button -->
                    <button id="authHeaderBtn" onclick="openAuthModal()" class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-charcoal-900 text-white hover:bg-black transition text-xs font-extrabold shadow-sm border border-stone-700">
                        <i class="fa-solid fa-user-circle text-sand-500 text-sm"></i>
                        <span id="userBadgeText">Sign In / Register</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MANDATORY ACCESS CONTROL LOCK OVERLAY FOR NEW/GUEST USERS -->
    <div id="appLockOverlay" class="fixed inset-0 z-50 bg-charcoal-900/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center text-white">
        <div class="max-w-md w-full bg-stone-900 border border-stone-700 p-8 rounded-3xl shadow-2xl space-y-5">
            <div class="w-16 h-16 rounded-3xl bg-terracotta-500 text-white mx-auto flex items-center justify-center text-2xl shadow-lg">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="text-2xl font-black text-white">Welcome to WanderStyle Studio</h2>
            <p class="text-xs text-stone-300 leading-relaxed font-medium">New visitors are required to create an account or sign in to access geo-synced travel guides, driver dispatch, smart wardrobe matching, and payment setup.</p>
            
            <div class="pt-2 flex flex-col gap-2.5">
                <button onclick="openAuthModal('register')" class="w-full py-3.5 bg-terracotta-500 hover:bg-terracotta-600 text-white font-extrabold rounded-2xl text-xs uppercase tracking-wider transition shadow-md">
                    <i class="fa-solid fa-user-plus mr-1.5"></i> Create New Account
                </button>
                <button onclick="openAuthModal('login')" class="w-full py-3.5 bg-stone-800 hover:bg-stone-700 text-stone-200 font-extrabold rounded-2xl text-xs uppercase tracking-wider transition border border-stone-600">
                    <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Already have an account? Sign In
